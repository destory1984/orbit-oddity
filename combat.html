<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Oddity - 전투 시험작</title>
<link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", sans-serif; color: #cfe; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 15px; line-height: 1.6; font-variant-numeric: tabular-nums; background: rgba(0,10,20,.6); padding: 10px 14px; border-radius: 6px; min-width: 220px; }
  .bar { display: inline-block; width: 120px; height: 8px; background: #233; vertical-align: middle; }
  .bar i { display: block; height: 100%; }
  #help { position: fixed; top: 12px; right: 12px; font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; background: rgba(0,10,20,.6); padding: 8px 12px; border-radius: 6px; text-align: right; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 33px; pointer-events: none; text-shadow: 0 0 8px #000; text-align: center; }
  #cross { position: fixed; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px; border: 1px solid #6f8; border-radius: 50%; pointer-events: none; }
  #radar { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); pointer-events: none; }
  .tgt { position: fixed; width: 28px; height: 28px; margin: -14px; border: 1px solid #f86; pointer-events: none; font-size: 11px; font-variant-numeric: tabular-nums; color: #f86; }
  .tgt span { position: absolute; top: 30px; left: 0; white-space: nowrap; }
  #nose { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; background: rgba(100,255,140,.6); border-radius: 50%; pointer-events: none; }
  #dead { position: fixed; left: 44%; top: 44%; width: 12%; height: 12%; border: 1px dashed rgba(100,255,140,.25); border-radius: 50%; pointer-events: none; }
  #stick { position: fixed; display: none; width: 120px; height: 120px; margin: -60px; border: 2px solid rgba(150,220,255,.35); border-radius: 50%; pointer-events: none; }
  #knob { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(150,220,255,.4); }
  #touchUi { display: none; position: fixed; right: 12px; bottom: 12px; flex-direction: column; gap: 10px; align-items: flex-end; }
  #touchUi button { font-size: 15px; font-family: inherit; color: #cfe; background: rgba(20,40,60,.7); border: 1px solid #4a6a8a; border-radius: 28px; padding: 12px 16px; touch-action: none; }
  #touchUi button.big { width: 76px; height: 76px; border-radius: 50%; padding: 0; font-size: 16px; border-color: #ffee88; }
  #touchUi button.on { border-color: #6f8; color: #6f8; }
  body.touch #touchUi { display: flex; }
  body.touch #help { display: none; }
  canvas { touch-action: none; }
  #bPause { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: 44px; height: 44px; border-radius: 50%; border: 1px solid #4a6a8a; background: rgba(20,40,60,.7); cursor: pointer; padding: 0; touch-action: none; }
  #bPause::before, #bPause::after { content: ''; position: absolute; top: 13px; width: 5px; height: 18px; background: #cfe; border-radius: 1px; }
  #bPause::before { left: 15px; } #bPause::after { right: 15px; }
  #bPause.paused::before { left: 16px; width: 0; height: 0; background: none; border-left: 15px solid #6f8; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-radius: 0; }
  #bPause.paused::after { display: none; }
  @media (max-width: 700px) {
    #help { display: none; }
    #hud { font-size: 12px; padding: 6px 8px; min-width: 0; }
    .bar { width: 70px; }
    #radar { width: 200px; height: 88px; }
  }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="loading">불러오는 중...</div>
<div id="hud"></div>
<div id="help">
W/S 앞뒤 추력 · A/D 좌우 · R/F 위아래<br>
마우스: 커서 쪽으로 배가 돈다 · 방향키도 된다 · Q/E 롤<br>
스페이스 레이저 · G·오른쪽 버튼 미사일<br>
V 마우스 방식 바꾸기(커서 따라가기 ↔ 움직인 만큼)<br>
C 누르고 있기: 내 배 둘러보기<br>
P·Esc 멈춤 · Z 보조 비행 · M 소리 끄기 · T 처음부터
</div>
<button id="bPause" title="멈춤 (P)" aria-label="멈춤"></button>
<div id="nose"></div>
<div id="dead"></div>
<div id="cross"></div>
<div id="stick"><div id="knob"></div></div>
<div id="touchUi">
  <button id="bSound" class="on">소리</button>
  <button id="bGyro">기울이기</button>
  <button id="bReset">다시</button>
  <button id="bMissile" class="big">미사일</button>
</div>
<script>if (matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0) document.body.classList.add('touch');</script>
<canvas id="radar" width="320" height="140"></canvas>
<div id="msg"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import RAPIER from 'rapier';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

await RAPIER.init();
document.getElementById('loading').remove();

const EARTH_R = 6371e3, ALT = 400e3;
const DT = 1 / 60;
const THRUST = 20, STRAFE = 10, ANG_ACC = 1.8, ANG_DAMP = 2.5, ASSIST_DAMP = 0.9;
const LASER_RANGE = 1200, LASER_DMG = 8, LASER_COOLDOWN = 0.15;
const MISSILE_SPEED = 140, MISSILE_TURN = 2.2, MISSILE_DMG = 70;
const ENEMY = { speed: 40, turn: 1.0, cooldown: 0.5, dmg: 5, spread: 0.025, range: 900 };
const _x = new THREE.Vector3(1, 0, 0), _y = new THREE.Vector3(0, 1, 0), _z = new THREE.Vector3(0, 0, 1);

// ---- renderer / scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 1e8);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.toneMapping = THREE.ACESFilmicToneMapping;
// soft studio reflections so the metal hull has something to mirror
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0x334455, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(1, 0.6, 0.8);
scene.add(sun);
{
  const n = 3000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(5e7);
    pos.set([v.x, v.y, v.z], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false })));
}
const earth = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, 96, 48), new THREE.MeshStandardMaterial({ color: 0x2a5d9f, roughness: 1 }));
earth.position.set(0, -(EARTH_R + ALT), 0);
scene.add(earth);

// ---- physics ----
const world = new RAPIER.World({ x: 0, y: 0, z: 0 });
world.timestep = DT;
const owners = new Map(); // collider handle -> entity

// station as cover, same shape as the docking prototype
const STATION_POS = new THREE.Vector3(0, 0, -1200);
const stationBody = world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(STATION_POS.x, STATION_POS.y, STATION_POS.z));
const stationGroup = new THREE.Group();
stationGroup.position.copy(STATION_POS);
scene.add(stationGroup);
{
  const mat = new THREE.MeshStandardMaterial({ color: 0xb8bcc4, metalness: 0.4, roughness: 0.6 });
  const box = (hx, hy, hz, x, y, z) => {
    owners.set(world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setRestitution(0.5), stationBody).handle, { kind: 'station' });
    const m = new THREE.Mesh(new THREE.BoxGeometry(hx * 2, hy * 2, hz * 2), mat);
    m.position.set(x, y, z); stationGroup.add(m);
  };
  box(60, 24, 40, 0, 36, -40); box(60, 24, 40, 0, -36, -40);
  box(15, 6, 40, -45, 0, -40); box(15, 6, 40, 45, 0, -40); box(60, 60, 2, 0, 0, -82);
}
let stationAngle = 0;

// ---- ships ----
// Procedural hull skin drawn on a canvas: plates, panel lines, rivets, a stripe and a registration mark.
// Returns color and roughness maps so worn plates read as duller metal.
const css = c => '#' + c.toString(16).padStart(6, '0');
function hullTextures(base, accent, label, seed = 1) {
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const N = 1024;
  const col = document.createElement('canvas'), rough = document.createElement('canvas');
  col.width = col.height = rough.width = rough.height = N;
  const c = col.getContext('2d'), r = rough.getContext('2d');
  c.fillStyle = css(base); c.fillRect(0, 0, N, N);
  r.fillStyle = '#8c8c8c'; r.fillRect(0, 0, N, N);
  // plates: recursive split, each plate slightly different tone and roughness
  const plate = (x, y, w, h, d) => {
    if (d < 4 && (w > 90 || h > 90) && rnd() < 0.85) {
      if (w > h) { const k = w * (0.3 + rnd() * 0.4); plate(x, y, k, h, d + 1); plate(x + k, y, w - k, h, d + 1); }
      else { const k = h * (0.3 + rnd() * 0.4); plate(x, y, w, k, d + 1); plate(x, y + k, w, h - k, d + 1); }
      return;
    }
    const t = (rnd() - 0.5) * 26;
    c.fillStyle = `rgba(${t > 0 ? '255,255,255' : '0,0,0'},${Math.abs(t) / 255})`; c.fillRect(x, y, w, h);
    const g = 110 + rnd() * 70 | 0; r.fillStyle = `rgb(${g},${g},${g})`; r.fillRect(x, y, w, h);
    c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 2; c.strokeRect(x + 1, y + 1, w - 2, h - 2);
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1; c.strokeRect(x + 3, y + 3, w - 6, h - 6);
    r.strokeStyle = '#ddd'; r.lineWidth = 3; r.strokeRect(x + 1, y + 1, w - 2, h - 2);
    c.fillStyle = 'rgba(0,0,0,.35)';
    for (let i = 8; i < w - 4; i += 18) { c.fillRect(x + i, y + 5, 2, 2); c.fillRect(x + i, y + h - 7, 2, 2); }
  };
  plate(0, 0, N, N, 0);
  // grime streaks
  for (let i = 0; i < 60; i++) {
    c.fillStyle = `rgba(30,25,20,${0.03 + rnd() * 0.05})`;
    c.fillRect(rnd() * N, rnd() * N, 2 + rnd() * 6, 40 + rnd() * 160);
  }
  // racing stripes and hazard chevrons
  c.fillStyle = css(accent); c.fillRect(0, N * 0.44, N, N * 0.05); c.fillRect(0, N * 0.51, N, N * 0.015);
  r.fillStyle = '#5a5a5a'; r.fillRect(0, N * 0.44, N, N * 0.085);
  c.save(); c.beginPath(); c.rect(0, N * 0.86, N, N * 0.04); c.clip();
  for (let x = -40; x < N; x += 40) { c.fillStyle = (x / 40) % 2 ? '#222' : '#e8c040'; c.beginPath(); c.moveTo(x, N * 0.9); c.lineTo(x + 20, N * 0.86); c.lineTo(x + 40, N * 0.86); c.lineTo(x + 20, N * 0.9); c.fill(); }
  c.restore();
  // registration
  c.font = `bold ${N * 0.07}px ui-monospace, monospace`; c.fillStyle = 'rgba(20,20,30,.85)';
  c.fillText(label, N * 0.06, N * 0.38); c.fillText(label, N * 0.6, N * 0.38);
  const mk = cv => { const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t; };
  const map = mk(col); map.colorSpace = THREE.SRGBColorSpace;
  return { map, roughnessMap: mk(rough) };
}
const glowTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const c = cv.getContext('2d'), g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.2, 'rgba(140,210,255,.9)'); g.addColorStop(0.5, 'rgba(60,120,255,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
})();
function canvasTex(size, draw) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  draw(cv.getContext('2d'), size);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
// rear bulkhead: dark plate, vent grille, hazard ring, two marker lamps
const tailTex = canvasTex(512, (c, N) => {
  const h = N / 2;
  c.fillStyle = '#3a3f47'; c.fillRect(0, 0, N, N);
  c.save(); c.beginPath(); c.arc(h, h, h - 6, 0, Math.PI * 2); c.clip();
  for (let a = 0; a < 16; a++) { c.fillStyle = a % 2 ? '#e8c040' : '#222'; c.beginPath(); c.moveTo(h, h); c.arc(h, h, h, a / 16 * Math.PI * 2, (a + 1) / 16 * Math.PI * 2); c.fill(); }
  c.fillStyle = '#4a505a'; c.beginPath(); c.arc(h, h, h - 34, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 3;
  for (let a = 0; a < 8; a++) { const t = a / 8 * Math.PI * 2; c.beginPath(); c.moveTo(h + Math.cos(t) * 70, h + Math.sin(t) * 70); c.lineTo(h + Math.cos(t) * (h - 36), h + Math.sin(t) * (h - 36)); c.stroke(); }
  // vent grille
  c.fillStyle = '#15181c'; c.fillRect(h - 110, h - 46, 220, 92);
  c.fillStyle = '#5a616c'; for (let y = h - 40; y < h + 44; y += 12) c.fillRect(h - 104, y, 208, 5);
  // rivets
  c.fillStyle = 'rgba(0,0,0,.6)';
  for (let a = 0; a < 40; a++) { const t = a / 40 * Math.PI * 2; c.beginPath(); c.arc(h + Math.cos(t) * (h - 44), h + Math.sin(t) * (h - 44), 3, 0, 7); c.fill(); }
  // lamps
  for (const [x, col] of [[h - 150, '#ff4040'], [h + 150, '#40ff70']]) {
    const g = c.createRadialGradient(x, h + 100, 0, x, h + 100, 22); g.addColorStop(0, '#fff'); g.addColorStop(0.4, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, h + 100, 22, 0, 7); c.fill();
  }
  c.restore();
});
// engine throat: turbine blades lit from inside
const nozzleTex = canvasTex(256, (c, N) => {
  const h = N / 2;
  const g = c.createRadialGradient(h, h, 0, h, h, h); g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, '#bfe6ff'); g.addColorStop(0.6, '#3a78c8'); g.addColorStop(1, '#0a1020');
  c.fillStyle = g; c.fillRect(0, 0, N, N);
  c.strokeStyle = 'rgba(10,20,40,.55)'; c.lineWidth = 5;
  for (let a = 0; a < 24; a++) { const t = a / 24 * Math.PI * 2; c.beginPath(); c.moveTo(h + Math.cos(t) * 26, h + Math.sin(t) * 26); c.quadraticCurveTo(h + Math.cos(t + 0.3) * 80, h + Math.sin(t + 0.3) * 80, h + Math.cos(t + 0.5) * h, h + Math.sin(t + 0.5) * h); c.stroke(); }
  c.fillStyle = '#1a2230'; c.beginPath(); c.arc(h, h, 22, 0, 7); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.8)'; c.lineWidth = 10; c.beginPath(); c.arc(h, h, h - 5, 0, 7); c.stroke();
});
// flame fade: opaque at the nozzle (bottom of the canvas = cone base), clear at the tip
const flameAlpha = (() => {
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 128;
  const c = cv.getContext('2d'), g = c.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0, '#000'); g.addColorStop(0.55, '#555'); g.addColorStop(1, '#fff');
  c.fillStyle = g; c.fillRect(0, 0, 4, 128);
  return new THREE.CanvasTexture(cv);
})();
const puffTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const c = cv.getContext('2d'), g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.4, 'rgba(220,235,255,.5)'); g.addColorStop(1, 'rgba(200,220,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
})();
// unit cone, base at z=0, tip at z=1, so scale.z is the flame length
const flameGeo = new THREE.ConeGeometry(1, 1, 20, 1, true).translate(0, 0.5, 0).rotateX(Math.PI / 2);
const flameMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, alphaMap: flameAlpha, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
// RCS thrusters: [name, position, gas direction] in the ship frame
const RCS = [
  ['left', [-1.45, 0, -2.6], [-1, 0, 0]], ['left', [-1.45, 0, 2.6], [-1, 0, 0]],
  ['right', [1.45, 0, -2.6], [1, 0, 0]], ['right', [1.45, 0, 2.6], [1, 0, 0]],
  ['bottom', [0, -0.85, -2.6], [0, -1, 0]], ['bottom', [0, -0.85, 2.6], [0, -1, 0]],
  ['top', [0, 0.9, -1], [0, 1, 0]], ['top', [0, 0.9, 3.2], [0, 1, 0]],
  ['nose', [0.5, 0, -4.4], [0, 0, -1]], ['nose', [-0.5, 0, -4.4], [0, 0, -1]],
  // rotation pairs: front and rear on opposite sides
  ['yawL', [1.3, 0, -3.4], [1, 0, 0]], ['yawL', [-1.4, 0, 4.2], [-1, 0, 0]],
  ['yawR', [-1.3, 0, -3.4], [-1, 0, 0]], ['yawR', [1.4, 0, 4.2], [1, 0, 0]],
  ['pitchU', [0, -0.7, -3.4], [0, -1, 0]], ['pitchU', [0, 0.8, 4.2], [0, 1, 0]],
  ['pitchD', [0, 0.7, -3.4], [0, 1, 0]], ['pitchD', [0, -0.8, 4.2], [0, -1, 0]],
  ['rollL', [5.8, -0.3, 3.2], [0, -1, 0]], ['rollL', [-5.8, 0.2, 3.2], [0, 1, 0]],
  ['rollR', [5.8, 0.2, 3.2], [0, 1, 0]], ['rollR', [-5.8, -0.3, 3.2], [0, -1, 0]],
];
const shipSkins = new Map();
// Ship faces -z, about 12 m wingspan and 10 m long, to match the 6x1x5 half-extent collider.
function makeShipMesh(base, accent, label) {
  const key = `${base}-${accent}-${label}`;
  if (!shipSkins.has(key)) {
    const tex = hullTextures(base, accent, label, base % 997 + 7);
    shipSkins.set(key, {
      hull: new THREE.MeshStandardMaterial({ ...tex, metalness: 0.55, roughness: 1, envMapIntensity: 1.2 }),
      dark: new THREE.MeshStandardMaterial({ color: 0x2a2e35, metalness: 0.8, roughness: 0.35 }),
      glass: new THREE.MeshPhysicalMaterial({ color: 0x0a1a30, metalness: 0.2, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.05, emissive: 0x0c2a48, emissiveIntensity: 0.6 }),
      nozzle: new THREE.MeshBasicMaterial({ map: nozzleTex }),
      tail: new THREE.MeshStandardMaterial({ map: tailTex, metalness: 0.6, roughness: 0.5 }),
    });
  }
  const m = shipSkins.get(key);
  const g = new THREE.Group();

  // fuselage: lathe profile, flattened, nose toward -z
  const prof = [[0, -5.2], [0.35, -4.8], [0.85, -3.6], [1.2, -1.5], [1.35, 0.8], [1.3, 3.2], [1.05, 4.6], [0.9, 4.95], [0.001, 4.95]].map(([r, y]) => new THREE.Vector2(r, y));
  const fus = new THREE.LatheGeometry(prof, 24).rotateX(Math.PI / 2).scale(1.15, 0.72, 1);
  g.add(new THREE.Mesh(fus, m.hull));
  // rear bulkhead plate, matching the flattened fuselage section
  const tail = new THREE.Mesh(new THREE.CircleGeometry(0.92, 32), m.tail);
  tail.scale.set(1.15, 0.72, 1); tail.position.set(0, 0, 4.97);
  g.add(tail);
  // small APU exhaust in the middle of the bulkhead
  const apu = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.3, 12).rotateX(Math.PI / 2), m.dark);
  apu.position.set(0, -0.32, 5.05); g.add(apu);

  // swept wings: planform extruded with a bevel
  const wingShape = new THREE.Shape();
  wingShape.moveTo(0.9, -1.8); wingShape.lineTo(5.6, 2.2); wingShape.lineTo(6, 3.4); wingShape.lineTo(5.2, 3.6); wingShape.lineTo(0.9, 3.4);
  const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.18, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 2 }).rotateX(Math.PI / 2);
  wingGeo.translate(0, 0.05, 0);
  // planar UVs from the top view so stripes run along the wing
  const pos = wingGeo.attributes.position, uv = wingGeo.attributes.uv;

    ensureNoise();

function fireLaser(shooter, spread, dmg, color) {

  if (spread) dir.add(new THREE.Vector3().randomDirection().multiplyScalar(spread)).normalize();

  if (shooter.kind === 'player') { const t = assistTarget(); if (t) dir.copy(posOf(t).sub(from).normalize()); }
  const hit = world.castRay(new RAPIER.Ray(from, dir), LASER_RANGE, true, undefined, undefined, undefined, shooter.body);
  const dist = hit ? (hit.toi ?? hit.timeOfImpact) : LASER_RANGE;
  beam(from, from.clone().add(dir.clone().multiplyScalar(dist)), color);
  shooter.kind === 'player' ? sfx.laser() : sfx.enemyLaser(from);

const lookM = new THREE.Matrix4();
function updateEnemy(e) {

  const local = new THREE.Vector3(aimX * th, -aimY * tv, -1).normalize();
  const fwd = new THREE.Vector3(0, 0, -1), a = local.angleTo(fwd);
  if (a > GIMBAL) local.copy(fwd.clone().lerp(local, GIMBAL / a).normalize());
  return local.applyQuaternion(quatOf(player));
}

// ---- game state ----
let rcsSoundCd = 0;
const rcsWasOn = {};
let player, enemies = [], kills = 0, wave = 0, missileCount = 0, laserCd = 0, waveDelay = 0;
const msg = document.getElementById('msg');

function spawnWave() {
  wave++;
  const n = 1 + wave;
  for (let i = 0; i < n; i++) {
    const dir = new THREE.Vector3().randomDirection();
    dir.z = -Math.abs(dir.z) - 0.5;
    const pos = posOf(player).add(dir.normalize().multiplyScalar(700 + Math.random() * 400));
    enemies.push(makeShip('enemy', pos, [0x5a2a2a, 0xffb020, 'X'], 40, 30));
  }
  missileCount = Math.min(missileCount + 2, 6);
  msg.textContent = `${wave}번째 무리 ${n}척`;
  setTimeout(() => { if (msg.textContent.endsWith('척')) msg.textContent = ''; }, 2000);
}
function reset() {
  if (player?.alive) removeShip(player);
  for (const e of enemies) if (e.alive) removeShip(e);
  for (const ms of missiles) scene.remove(ms.m);
  missiles.length = 0;
  enemies = []; kills = 0; wave = 0; missileCount = 2; msg.textContent = '';
  player = makeShip('player', new THREE.Vector3(0, 0, 0), [0xd8dce2, 0xc8502a, 'OO-01'], 100, 60);
  spawnWave();
}
reset();

function step() {
  stationAngle += 2 * Math.PI / 60 * DT;
  stationBody.setNextKinematicRotation(new THREE.Quaternion().setFromAxisAngle(_z, stationAngle));

  if (player.alive) {
    const q = quatOf(player);
    const lin = (k('KeyS') - k('KeyW') + stickY) * THRUST, lx = (k('KeyD') - k('KeyA') + stickX) * STRAFE, ly = (k('KeyR') - k('KeyF')) * STRAFE;
    const v = velOf(player).add(new THREE.Vector3(lx, ly, lin).applyQuaternion(q).multiplyScalar(DT));
    if (assist && !lin && !lx && !ly) v.multiplyScalar(Math.exp(-ASSIST_DAMP * DT));
    player.body.setLinvel(v, true);
    player.mesh.userData.thrust = Math.max(0, -lin / THRUST) * 0.8 + (lx || ly ? 0.2 : 0) + 0.15;
    if (engineGain) {
      const th = Math.min(1, Math.abs(lin) / THRUST);
      engineGain.gain.setTargetAtTime(muted ? 0 : th * 0.35, ac.currentTime, th ? 0.06 : 0.25);
      engineFilter.frequency.setTargetAtTime(th ? 2600 : 300, ac.currentTime, th ? 0.12 : 0.3);
    }

    // RCS: gas leaves on the side opposite to the push
    const sx = Math.sign(lx), sy = Math.sign(ly);
    const rcsOn = player.mesh.userData.rcsOn;
    rcsOn.left = sx > 0 ? 1 : 0; rcsOn.right = sx < 0 ? 1 : 0;
    rcsOn.bottom = sy > 0 ? 1 : 0; rcsOn.top = sy < 0 ? 1 : 0;
    rcsOn.nose = lin > 0 ? 1 : 0;

    const pitch = k('ArrowUp') - k('ArrowDown');
    const yaw = k('ArrowLeft') - k('ArrowRight');
    const roll = k('KeyQ') - k('KeyE');
    // work in the ship frame: keys accelerate, the aim point sets a target turn rate
    const qi = q.clone().invert();
    const w = player.body.angvel();
    const wl = new THREE.Vector3(w.x, w.y, w.z).applyQuaternion(qi);
    wl.add(new THREE.Vector3(pitch, yaw, roll).multiplyScalar(ANG_ACC * DT));
    const dz = v => Math.abs(v) < DEADZONE ? 0 : Math.sign(v) * (Math.abs(v) - DEADZONE) / (1 - DEADZONE);
    const ax = dz(aimX), ay = dz(aimY);
    const blend = 1 - Math.exp(-6 * DT), damp = Math.exp(-ANG_DAMP * DT);
    if (ax || ay) { wl.x += (-ay * AIM_RATE - wl.x) * blend; wl.y += (-ax * AIM_RATE - wl.y) * blend; }
    else { if (!pitch) wl.x *= damp; if (!yaw) wl.y *= damp; }
    if (!roll) wl.z *= damp;
    // rotation jets fire while the turn rate is changing
    const before = new THREE.Vector3(w.x, w.y, w.z).applyQuaternion(qi);
    const acc = wl.clone().sub(before).divideScalar(DT);
    const jet = v => Math.max(0, Math.min(1, (v - 0.15) * 2));
    rcsOn.yawL = jet(acc.y); rcsOn.yawR = jet(-acc.y);
    rcsOn.pitchU = jet(acc.x); rcsOn.pitchD = jet(-acc.x);
    rcsOn.rollL = jet(acc.z); rcsOn.rollR = jet(-acc.z);
    // one "chk" when a thruster group switches on, not a repeating burst
    rcsSoundCd -= DT;
    let fresh = 0;
    for (const [name, v] of Object.entries(rcsOn)) {
      if (v > 0.05 && !(rcsWasOn[name] > 0.05)) fresh = Math.max(fresh, v);
      rcsWasOn[name] = v;
    }
    if (fresh && rcsSoundCd <= 0) { sfx.rcs(Math.min(1, fresh)); rcsSoundCd = 0.15; }
    player.body.setAngvel(wl.applyQuaternion(q), true);
    if (relDX || relDY) {
      // relative mouse: rotate exactly as far as the mouse moved
      const turn = new THREE.Quaternion().setFromEuler(new THREE.Euler(-relDY * REL_SENS, -relDX * REL_SENS, 0, 'YXZ'));
      player.body.setRotation(q.clone().multiply(turn), true);
      relDX = relDY = 0;
    }

    laserCd -= DT;
    const autoFire = usedTouch && assistTarget();
    if ((k('Space') || autoFire) && laserCd <= 0) { laserCd = LASER_COOLDOWN; fireLaser(player, 0, LASER_DMG, 0x66ff88); }
  }

  for (const s of [player, ...enemies]) {
    if (!s.alive) continue;
    s.sinceHit += DT;
    if (s.sinceHit > 2) s.shield = Math.min(s.shieldMax, s.shield + 6 * DT);
    if (s.kind === 'enemy') updateEnemy(s);
  }
  updateMissiles();
  world.step();

  enemies = enemies.filter(e => e.alive);
  if (player.alive && enemies.length === 0) {
    waveDelay += DT;
    if (waveDelay > 3) { waveDelay = 0; spawnWave(); }
  }
}

// ---- HUD, radar, target boxes ----
const hud = document.getElementById('hud');
const bar = (v, max, color) => `<span class="bar"><i style="width:${Math.max(0, v / max * 100)}%;background:${color}"></i></span>`;
const radar = document.getElementById('radar'), rc = radar.getContext('2d');
const tgtDivs = [];
function drawOverlay() {
  const pa = player.alive;
  hud.innerHTML =
    `방패 ${bar(pa ? player.shield : 0, player.shieldMax, '#4af')}<br>` +
    `선체 ${bar(pa ? player.hull : 0, player.hullMax, '#f84')}<br>` +
    `속도 ${pa ? velOf(player).length().toFixed(0) : 0} m/s<br>` +
    `미사일 ${'▲'.repeat(missileCount)}${'·'.repeat(6 - missileCount)}<br>` +
    `격추 ${kills} · 무리 ${wave}<br>` +
    `보조 비행 ${assist ? '켜짐' : '꺼짐'}`;

  // Elite-style scanner: ellipse is the ship's horizontal plane, sticks show height
  const W = radar.width, H = radar.height, R = 3000;
  rc.clearRect(0, 0, W, H);
  rc.strokeStyle = 'rgba(100,255,160,.5)'; rc.fillStyle = 'rgba(0,30,20,.4)';
  rc.beginPath(); rc.ellipse(W / 2, H / 2, W / 2 - 4, H / 2 - 4, 0, 0, Math.PI * 2); rc.fill(); rc.stroke();
  rc.beginPath(); rc.moveTo(W / 2, 4); rc.lineTo(W / 2, H - 4); rc.moveTo(4, H / 2); rc.lineTo(W - 4, H / 2); rc.stroke();
  const ws = tgtDivs.length;
  if (!pa) return;
  const inv = quatOf(player).invert(), pp = posOf(player);
  const blips = enemies.map(e => ({ p: posOf(e), c: '#f66' })).concat([{ p: STATION_POS.clone(), c: '#6cf' }], missiles.map(m => ({ p: m.m.position, c: '#ff8' })));
  for (const b of blips) {
    const l = b.p.clone().sub(pp).applyQuaternion(inv);
    const s = Math.min(1, l.length() / R) / (l.length() || 1);
    const x = W / 2 + l.x * s * (W / 2 - 6), y = H / 2 + l.z * s * (H / 2 - 6), h = -l.y * s * (H / 2 - 6);
    rc.strokeStyle = b.c; rc.fillStyle = b.c;
    rc.beginPath(); rc.moveTo(x, y); rc.lineTo(x, y + h); rc.stroke();
    rc.fillRect(x - 3, y + h - 2, 6, 3);
  }

  // boxes around enemies on screen, green when the laser will lock on
  const locked = assistTarget();
  const cr = Math.tan(AIM_CONE) / Math.tan(camera.fov * Math.PI / 360) * innerHeight / 2, cross = document.getElementById('cross');
  // ring sits where the guns actually point (aim point, clamped to the gimbal)
  const ap = posOf(player).addScaledVector(aimDir(), 500).project(camera);
  Object.assign(cross.style, {
    width: `${cr * 2}px`, height: `${cr * 2}px`, margin: `-${cr}px`, borderColor: locked ? '#6f8' : 'rgba(100,255,140,.35)',
    left: `${Math.max(0, Math.min(innerWidth, (ap.x + 1) / 2 * innerWidth))}px`, top: `${Math.max(0, Math.min(innerHeight, (1 - ap.y) / 2 * innerHeight))}px`,
  });
  let i = 0;
  for (const e of enemies) {
    const p = posOf(e), sp = p.clone().project(camera);
    const div = tgtDivs[i] ?? (tgtDivs[i] = Object.assign(document.createElement('div'), { className: 'tgt', innerHTML: '<span></span>' }));
    if (!div.isConnected) document.body.appendChild(div);
    const on = sp.z < 1 && Math.abs(sp.x) < 1 && Math.abs(sp.y) < 1;
    div.style.display = on ? 'block' : 'none';
    div.style.left = `${(sp.x + 1) / 2 * innerWidth}px`; div.style.top = `${(1 - sp.y) / 2 * innerHeight}px`;
    div.style.borderColor = div.style.color = e === locked ? '#6f8' : '#f86';
    div.firstChild.textContent = `${p.distanceTo(pp).toFixed(0)}m ${'|'.repeat(Math.ceil(e.hull / 10))}`;
    i++;
  }
  for (; i < ws; i++) tgtDivs[i].style.display = 'none';
}

// ---- pause ----
var paused = false;
function setPaused(v) {
  if (v === paused || (v && player && !player.alive)) return;
  paused = v;
  document.getElementById('bPause').classList.toggle('paused', paused);
  if (paused) { msg.dataset.prev = msg.innerHTML; msg.innerHTML = '<div>멈춤<br><small style="font-size:17px">P 또는 ▶ 를 누르면 이어서</small></div>'; }
  else msg.innerHTML = msg.dataset.prev ?? '';
  if (ac) paused ? ac.suspend() : ac.resume();
}

// ---- loop ----
let acc = 0, last = performance.now();
const camAnchor = { pos: new THREE.Vector3(), quat: new THREE.Quaternion() };
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dt;
  if (paused) acc = 0;
  while (acc >= DT) { step(); acc -= DT; }

  stationGroup.quaternion.setFromAxisAngle(_z, stationAngle);
  for (const s of [player, ...enemies]) {
    if (!s.alive) continue;
    const p = s.body.translation(), r = s.body.rotation();
    s.mesh.position.set(p.x, p.y, p.z); s.mesh.quaternion.set(r.x, r.y, r.z, r.w);
    animateShipMesh(s.mesh, now / 1000);
  }
  if (player.alive) { camAnchor.pos.copy(player.mesh.position); camAnchor.quat.copy(player.mesh.quaternion); }
  if (keys.has('KeyC')) {
    // hold C: slow orbit around the ship to look at it
    const a = now / 4000, off = new THREE.Vector3(Math.sin(a) * 16, 5, Math.cos(a) * 16).applyQuaternion(camAnchor.quat);
    camera.position.copy(camAnchor.pos).add(off);
    camera.up.copy(_y).applyQuaternion(camAnchor.quat);
    camera.lookAt(camAnchor.pos);
  } else {
    camera.position.copy(new THREE.Vector3(0, 4, 20).applyQuaternion(camAnchor.quat).add(camAnchor.pos));
    camera.quaternion.copy(camAnchor.quat);
  }

  for (const b of beams) { b.t -= dt; if (b.t <= 0) { scene.remove(b.l); b.l.geometry.dispose(); } }
  for (let i = beams.length - 1; i >= 0; i--) if (beams[i].t <= 0) beams.splice(i, 1);
  for (const b of blasts) {
    b.t -= dt;
    const a = b.p.geometry.attributes.position;
    for (let i = 0; i < b.vel.length; i++) a.setXYZ(i, a.getX(i) + b.vel[i].x * dt, a.getY(i) + b.vel[i].y * dt, a.getZ(i) + b.vel[i].z * dt);
    a.needsUpdate = true;
    b.p.material.opacity = Math.max(0, b.t / 1.5); b.light.intensity = 3000 * Math.max(0, b.t - 1);
    if (b.t <= 0) scene.remove(b.p, b.light);
  }
  for (let i = blasts.length - 1; i >= 0; i--) if (blasts[i].t <= 0) blasts.splice(i, 1);

  drawOverlay();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
